name: Browsing Runtime Contract

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  runtime-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            playwright-worker/package-lock.json
      - name: Install MCP dependencies
        run: npm --prefix mcp-server ci --ignore-scripts
      - name: Install worker dependencies
        run: npm --prefix playwright-worker ci --ignore-scripts
      - name: Install Microsoft Edge and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npm exec --prefix playwright-worker -- playwright install --with-deps msedge
      - name: Install Microsoft Edge
        if: runner.os == 'Windows'
        run: npm exec --prefix playwright-worker -- playwright install msedge
      - name: Typecheck runtime sources
        run: npm run typecheck
      - name: Run runtime contract regressions
        run: npm test
